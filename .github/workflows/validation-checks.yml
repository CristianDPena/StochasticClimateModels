name: Validation framework checks
on:
  push:
    paths: ['validation/**', '.github/workflows/validation-checks.yml']
  pull_request:
    paths: ['validation/**', '.github/workflows/validation-checks.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - run: Rscript validation/setup.R
      - run: Rscript validation/tests/test_validation.R
      - run: python3 -m py_compile validation/schedule.py
      - run: Rscript validation/run.R --command=init --out=validation/results/ci
# Full simulations are deliberately not dispatched to Actions or billed cloud runners.
